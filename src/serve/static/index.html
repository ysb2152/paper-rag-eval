<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperRAG</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --bg2: #e7ecf3;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5c6670;
      --border: #e2e6ea;
      --accent: #3b6fb5;
      --accent2: #5a97d8;
      --accent-soft: #e8eefc;
      --evidence: #f4f2ec;
      --abstain: #a8651d;
      --abstain-soft: #fbeede;
      --shadow: 0 1px 2px rgba(20,30,50,.05), 0 10px 28px rgba(20,30,50,.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151a;
        --bg2: #0b0e12;
        --card: #1c2127;
        --text: #e7ebef;
        --muted: #9aa5b1;
        --border: #2b313a;
        --accent: #6fa0e0;
        --accent2: #8ab6ef;
        --accent-soft: #1e2a3d;
        --evidence: #22262c;
        --abstain: #e0a35c;
        --abstain-soft: #2e2418;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.38);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1100px 560px at 50% -220px, var(--bg2), var(--bg)) no-repeat fixed, var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .logo {
      width: 46px; height: 46px; flex: none; border-radius: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      color: #fff; box-shadow: var(--shadow);
    }
    .logo svg { width: 25px; height: 25px; }
    h1 {
      font-size: 1.75rem; margin: 0; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: var(--muted); margin-top: 2px; font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      resize: vertical;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .row { display: flex; gap: 14px; margin-bottom: 14px; }
    .row > div:first-child { flex: 1; }
    .k-field { width: 110px; }
    button { font: inherit; border: 0; cursor: pointer; }
    button#ask {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border-radius: 10px;
      padding: 12px 24px; font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform .12s, filter .12s;
    }
    button#ask:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button#ask:active { transform: translateY(0); }
    button:disabled { opacity: 0.55; cursor: default; filter: none; transform: none; }
    .answer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .answer-head .ic {
      width: 27px; height: 27px; flex: none; border-radius: 8px;
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    .answer-head .ic svg { width: 15px; height: 15px; }
    .answer-head h2 { font-size: 1.05rem; margin: 0; }
    .answer-head .spacer { flex: 1; }
    .badge {
      font-size: 0.75rem; font-weight: 600;
      padding: 3px 11px; border-radius: 999px;
      background: var(--abstain-soft); color: var(--abstain);
    }
    .badge.routed {
      background: var(--accent-soft); color: var(--accent);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .badge.routed::before {
      content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--accent);
    }
    #answer { font-size: 1.08rem; min-height: 1.6em; white-space: pre-wrap; }
    .cursor { display: inline-block; width: 7px; background: var(--accent); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    .status { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
    .evidence-list { list-style: none; margin: 0; padding: 0; counter-reset: ev; }
    .evidence-list li {
      counter-increment: ev;
      background: var(--evidence);
      border: 1px solid transparent;
      border-radius: 11px;
      padding: 13px 15px 13px 46px;
      margin-bottom: 10px;
      position: relative;
      font-size: 0.92rem;
      color: var(--text);
      transition: transform .12s, border-color .12s;
    }
    .evidence-list li:hover { transform: translateY(-1px); border-color: var(--border); }
    .evidence-list li::before {
      content: counter(ev);
      position: absolute;
      left: 13px; top: 13px;
      width: 23px; height: 23px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 0.72rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .hidden { display: none; }
    .hint { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
    .mode-toggle {
      display: inline-flex; gap: 4px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 11px; padding: 4px; margin-bottom: 18px;
    }
    .mode-btn {
      background: transparent; color: var(--muted); font-weight: 600;
      padding: 7px 16px; border-radius: 8px;
      transition: background .15s, color .15s;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/>
          <path d="M13 3l5 5"/><path d="M13 3v5h5"/>
          <circle cx="16" cy="16" r="3"/><path d="M18.2 18.2L21 21"/>
        </svg>
      </div>
      <div>
        <h1>PaperRAG</h1>
        <div class="sub">평가 주도 RAG — 논문을 지정하거나, 코퍼스에서 논문을 자동으로 골라 근거를 인용해 답합니다</div>
      </div>
    </header>

    <div class="card">
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" data-mode="single">단일 논문</button>
        <button type="button" class="mode-btn" data-mode="corpus">코퍼스 (자동 선택)</button>
      </div>
      <div class="row" id="paper-row">
        <div>
          <label for="paper">논문 JSON 경로</label>
          <input id="paper" value="data/qasper-train-first-paper.json" spellcheck="false">
          <div class="hint">서버 작업 디렉터리 기준 상대 경로 (Qasper 논문 한 행 JSON)</div>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="question">질문</label>
          <textarea id="question" rows="2" placeholder="How big is seed lexicon used for training?">How big is seed lexicon used for training?</textarea>
        </div>
        <div class="k-field">
          <label for="k">근거 수 k</label>
          <input id="k" type="number" min="1" max="20" value="5">
        </div>
      </div>
      <button id="ask">질문</button>
    </div>

    <div id="result" class="card hidden">
      <div class="answer-head">
        <span class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        <h2>답변</h2>
        <span class="spacer"></span>
        <span id="routed" class="badge routed hidden"></span>
        <span id="abstained" class="badge hidden">근거 부족 · 보류</span>
      </div>
      <div id="answer"></div>
      <div id="status" class="status"></div>
    </div>

    <div id="evidence-card" class="card hidden">
      <div class="answer-head">
        <span class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>
        </span>
        <h2>인용 근거</h2>
      </div>
      <ul id="evidence" class="evidence-list"></ul>
    </div>
  </div>

  <script>
    const btn = document.getElementById("ask");
    const answerEl = document.getElementById("answer");
    const statusEl = document.getElementById("status");
    const abstainedEl = document.getElementById("abstained");
    const routedEl = document.getElementById("routed");
    const resultCard = document.getElementById("result");
    const evidenceCard = document.getElementById("evidence-card");
    const evidenceEl = document.getElementById("evidence");
    const paperRow = document.getElementById("paper-row");

    // 모드 토글 — 코퍼스 모드에선 논문 경로 입력을 숨긴다
    let mode = "single";
    document.querySelectorAll(".mode-btn").forEach((b) => {
      b.addEventListener("click", () => {
        mode = b.dataset.mode;
        document.querySelectorAll(".mode-btn").forEach((x) => x.classList.toggle("active", x === b));
        paperRow.classList.toggle("hidden", mode === "corpus");
      });
    });

    btn.addEventListener("click", ask);

    async function ask() {
      const question = document.getElementById("question").value.trim();
      const evidence_k = parseInt(document.getElementById("k").value, 10) || 5;
      const paper_path = document.getElementById("paper").value.trim();
      if (!question) return;
      if (mode === "single" && !paper_path) return;

      btn.disabled = true;
      resultCard.classList.remove("hidden");
      evidenceCard.classList.add("hidden");
      abstainedEl.classList.add("hidden");
      routedEl.classList.add("hidden");
      evidenceEl.innerHTML = "";
      answerEl.innerHTML = '<span class="cursor">&nbsp;</span>';
      statusEl.textContent = mode === "corpus"
        ? "코퍼스에서 논문을 고르고 답을 생성하는 중…"
        : "검색하고 답을 생성하는 중…";

      try {
        if (mode === "corpus") await askCorpus(question, evidence_k);
        else await askSingle(paper_path, question, evidence_k);
      } catch (e) {
        answerEl.textContent = "";
        statusEl.textContent = "요청 실패: " + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    // 코퍼스 모드 — 라우팅→검색→생성을 한 번에 받아 표시(비스트리밍). 라우팅된 논문도 보여준다
    async function askCorpus(question, evidence_k) {
      const res = await fetch("/ask/corpus", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, evidence_k }),
      });
      if (!res.ok) throw new Error("서버 오류 " + res.status);
      const data = await res.json();
      routedEl.textContent = "라우팅: " + data.routed_paper_id;
      routedEl.classList.remove("hidden");
      renderEvidence(data.evidence);
      answerEl.textContent = data.answer;
      statusEl.textContent = "";
      if (data.abstained) abstainedEl.classList.remove("hidden");
    }

    // 단일 논문 모드 — 기존 스트리밍(/ask/stream)
    async function askSingle(paper_path, question, evidence_k) {
      let answer = "";
      const setAnswer = () => {
        answerEl.innerHTML = answer.replace(/</g, "&lt;") + '<span class="cursor">&nbsp;</span>';
      };
      const res = await fetch("/ask/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paper_path, question, evidence_k }),
      });
      if (!res.ok) throw new Error("서버 오류 " + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          if (!chunk.startsWith("data:")) continue;
          const ev = JSON.parse(chunk.slice(5).trim());
          if (ev.type === "evidence") {
            renderEvidence(ev.evidence);
            statusEl.textContent = "답 생성 중…";
          } else if (ev.type === "token") {
            answer += ev.text;
            setAnswer();
          } else if (ev.type === "done") {
            answerEl.textContent = answer;
            statusEl.textContent = "";
            if (ev.abstained) abstainedEl.classList.remove("hidden");
          }
        }
      }
    }

    function renderEvidence(list) {
      evidenceEl.innerHTML = "";
      for (const text of list) {
        const li = document.createElement("li");
        li.textContent = text;
        evidenceEl.appendChild(li);
      }
      if (list.length) evidenceCard.classList.remove("hidden");
    }
  </script>
</body>
</html>
